# EVOL Eye — single-file Windows .exe (Go + WebView2 wrapper)
#
# Builds dist/ (Vite), stages it into the Go module, cross-compiles the
# portable wrapper (embedded HTTP server + WebView2 window) to a Windows
# executable with Zig, runs the headless selftest, and publishes the exe as
# a CI artifact and (on tags) as a GitHub Release asset.
#
# Pipeline:
#   1. selftest (ubuntu)  — builds+runs the pure-Go selftest binary against
#                           the real embedded bundle (exit 0 = PASS)
#   2. build (ubuntu)     — cross-compiles Evol-Eye-Installer.exe (GOOS=windows
#                           GOARCH=amd64, CGO via Zig) and the Windows selftest
#   3. win-smoke (windows-latest) — runs the cross-compiled selftest.exe on a
#                           real Windows runner (no toolchain needed)
#   4. release (tags)     — attaches the exe + selftest + SHA256SUMS.txt to a
#                           GitHub Release
#
# Triggers: pushes to feat/exe-installer and tag pushes (exe-v* /
# installer-exe-v*, matching the rest of the repo's installer tagging).
#
# Supply-chain hardening:
#   - L-4: every mutable @v4 action is pinned to an immutable commit SHA.
#   - M-4: every toolchain tarball (Go, Zig, Node) is verified with
#     `sha256sum -c` against the expected digest in env: before use.
#   - setup-node is intentionally not used here: M-4 requires verifying the
#     actual downloaded Node artifact, which setup-node offers no hook for.

name: EXE Installer (Go + WebView2)

on:
  push:
    branches: [feat/exe-installer]
    tags: ['exe-v*', 'installer-exe-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-exe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27.1'
  ZIG_VERSION: '0.16.0'
  NODE_VERSION: '24.14.0'
  # M-4: expected SHA-256 digests of the toolchain tarballs downloaded below.
  GO_SHA256: '63d339f0da5ab53635a56f2490a7984dfe12dfcff22ad749f63edaf590168445'
  ZIG_SHA256: '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00'
  NODE_SHA256: 'dbf5b8665dec15e59e6359a517fefb47b23fdb9152d8def975b9bca3dfc6d355'

jobs:
  selftest:
    name: Headless selftest (embedded bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install Node.js (checksum-verified)
        run: |
          curl -fsSL --retry 3 -o /tmp/node.tar.gz \
            "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.gz"
          echo "${NODE_SHA256}  /tmp/node.tar.gz" | sha256sum -c -
          sudo tar -C /usr/local -xzf /tmp/node.tar.gz
          sudo ln -sf /usr/local/node-v${NODE_VERSION}-linux-x64/bin/node \
            /usr/local/node-v${NODE_VERSION}-linux-x64/bin/npm \
            /usr/local/node-v${NODE_VERSION}-linux-x64/bin/npx \
            /usr/local/bin/
          node --version
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'

      - name: Install locked dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Install Go toolchain (checksum-verified)
        run: |
          curl -fsSL --retry 3 -o /tmp/go.tgz \
            "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          echo "${GO_SHA256}  /tmp/go.tgz" | sha256sum -c -
          sudo tar -C /usr/local -xzf /tmp/go.tgz
          /usr/local/go/bin/go version

      - name: Build and run selftest
        run: |
          npm run installer:exe:selftest -- --go /usr/local/go/bin/go
        env:
          GO: /usr/local/go/bin/go

  build:
    name: Cross-compile Windows .exe
    needs: selftest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install Node.js (checksum-verified)
        run: |
          curl -fsSL --retry 3 -o /tmp/node.tar.gz \
            "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.gz"
          echo "${NODE_SHA256}  /tmp/node.tar.gz" | sha256sum -c -
          sudo tar -C /usr/local -xzf /tmp/node.tar.gz
          sudo ln -sf /usr/local/node-v${NODE_VERSION}-linux-x64/bin/node \
            /usr/local/node-v${NODE_VERSION}-linux-x64/bin/npm \
            /usr/local/node-v${NODE_VERSION}-linux-x64/bin/npx \
            /usr/local/bin/
          node --version
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'

      - name: Install locked dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Install Go toolchain (checksum-verified)
        run: |
          curl -fsSL --retry 3 -o /tmp/go.tgz \
            "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          echo "${GO_SHA256}  /tmp/go.tgz" | sha256sum -c -
          sudo tar -C /usr/local -xzf /tmp/go.tgz
          /usr/local/go/bin/go version

      - name: Install Zig toolchain (checksum-verified, Windows-targeted C/C++ for CGo)
        run: |
          curl -fsSL --retry 3 -o /tmp/zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_SHA256}  /tmp/zig.tar.xz" | sha256sum -c -
          sudo tar -C /usr/local -xf /tmp/zig.tar.xz
          sudo mv /usr/local/zig-x86_64-linux-${ZIG_VERSION} /usr/local/zig
          /usr/local/zig/zig version

      - name: Cross-compile exe + selftest (GOOS=windows GOARCH=amd64)
        id: build
        run: |
          npm run installer:exe -- \
            --go /usr/local/go/bin/go \
            --zig /usr/local/zig/zig
          ls -la dist-installer/
        env:
          GO: /usr/local/go/bin/go
          ZIG: /usr/local/zig/zig

      - name: Verify artifacts
        run: |
          file dist-installer/Evol-Eye-Installer.exe
          test -s dist-installer/Evol-Eye-Selftest.exe
          test -s dist-installer/SHA256SUMS.txt
          # SHA256SUMS.txt contains bare filenames (no dist-installer/ prefix),
          # so the check must run from inside the directory or sha256sum looks
          # for the files in the repo root and fails with 'No such file'.
          (cd dist-installer && sha256sum -c SHA256SUMS.txt)

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evol-eye-installer
          path: |
            dist-installer/Evol-Eye-Installer.exe
            dist-installer/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload selftest (Windows)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evol-eye-selftest-windows
          path: dist-installer/Evol-Eye-Selftest.exe
          if-no-files-found: error
          retention-days: 30

  win-smoke:
    name: Windows selftest smoke
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Download Windows selftest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: evol-eye-selftest-windows
          path: selftest-win/

      - name: Run cross-compiled selftest on Windows
        shell: bash
        run: ./selftest-win/Evol-Eye-Selftest.exe

  release:
    name: Publish GitHub Release
    needs: [build, win-smoke]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: evol-eye-installer
          path: dist-installer/

      - name: Download Windows selftest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: evol-eye-selftest-windows
          path: selftest-win/

      - name: Generate release notes
        run: |
          git log --oneline --no-merges "$(git tag --sort=-version:refname | head -n 2 | tail -n 1)..HEAD" 2>/dev/null > release-notes.txt || true

      - name: Create or update release
        # SHA-pinned (was @v2) — the tag moved on 2026-09-07; resolve with:
        # gh api repos/softprops/action-gh-release/git/ref/tags/v2
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ github.ref_name }}
          name: EVOL Eye Installer ${{ github.ref_name }}
          prerelease: false
          body_path: release-notes.txt
          fail_on_unmatched_files: true
          files: |
            dist-installer/Evol-Eye-Installer.exe
            dist-installer/SHA256SUMS.txt
            selftest-win/Evol-Eye-Selftest.exe
