name: Installer Build

on:
  pull_request:
  push:
    tags:
      - 'installer-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Installer tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run installer test suite
        run: npm run installer:test

  build:
    name: Build release bundle
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build release bundle
        run: npm run installer:build

      - name: Verify bundle integrity
        run: node scripts/installer/verify.mjs

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-installer
          path: dist-installer/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-installer
          path: dist-installer/

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
            PRERELEASE=false
          else
            TAG="installer-canary-${{ github.run_id }}"
            PRERELEASE=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: |
          git log --oneline --no-merges "$(git tag --sort=-version:refname | head -n 2 | tail -n 1 )..HEAD" 2>/dev/null > release-notes.txt || true

      - name: Create or update release
        # L15: SHA-pinned (was @v2) — the tag moved on 2026-09-07;
        # resolve with: gh api repos/softprops/action-gh-release/git/ref/tags/v2
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: EVOL Eye Installer ${{ steps.tag.outputs.tag }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          body_path: release-notes.txt
          fail_on_unmatched_files: true
          files: |
            dist-installer/Evol-Eye-Setup-*.zip
            dist-installer/SHA256SUMS.txt
            dist-installer/installer.json